<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Oussama Lmekkeddem - Software Engineer</title>
  <desc id="desc">A custom developer dashboard presenting Oussama as a full-stack and platform engineer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0b1b32"/>
      <stop offset="1" stop-color="#102b32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientTransform="translate(905 128) rotate(90) scale(260)">
      <stop stop-color="#1f6feb" stop-opacity=".33"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0" cy="0" r="1" gradientTransform="translate(163 385) rotate(90) scale(220)">
      <stop stop-color="#238636" stop-opacity=".3"/>
      <stop offset="1" stop-color="#238636" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#8b949e" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="430" rx="28" fill="url(#glowBlue)"/>
  <rect width="1200" height="430" rx="28" fill="url(#glowGreen)"/>

  <g opacity=".55">
    <path d="M0 355 C210 290 300 430 520 366 S870 282 1200 356" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <path d="M0 373 C220 308 312 448 534 384 S884 300 1200 374" fill="none" stroke="#58a6ff" stroke-opacity=".2"/>
  </g>

  <g transform="translate(54 48)">
    <circle cx="8" cy="8" r="6" fill="#ff7b72"/>
    <circle cx="30" cy="8" r="6" fill="#d29922"/>
    <circle cx="52" cy="8" r="6" fill="#3fb950"/>
    <text x="78" y="13" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">profile://oussama-lmekkeddem</text>
  </g>

  <g transform="translate(66 109)">
    <text x="0" y="0" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="3">HELLO, I'M</text>
    <text x="0" y="65" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="57" font-weight="800" letter-spacing="-1">Oussama Lmekkeddem</text>
    <rect x="0" y="87" width="535" height="3" rx="2" fill="url(#accent)"/>
    <text x="0" y="129" fill="#b8c4d6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">SOFTWARE ENGINEER  ·  FULL-STACK  ·  PLATFORM BUILDER</text>
    <text x="0" y="176" fill="#8b949e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Designing secure products from architecture to production.</text>
  </g>

  <g transform="translate(695 79)" filter="url(#shadow)">
    <rect width="445" height="250" rx="18" fill="#0d1117" stroke="#30363d"/>
    <rect width="445" height="42" rx="18" fill="#161b22"/>
    <rect y="28" width="445" height="14" fill="#161b22"/>
    <circle cx="22" cy="21" r="5" fill="#ff7b72"/>
    <circle cx="40" cy="21" r="5" fill="#d29922"/>
    <circle cx="58" cy="21" r="5" fill="#3fb950"/>
    <text x="222" y="26" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">engineer.ts</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <text x="24" y="76" fill="#ff7b72">class</text>
      <text x="72" y="76" fill="#f0f6fc">SoftwareEngineer {</text>
      <text x="43" y="108"><tspan fill="#79c0ff">backend</tspan><tspan fill="#8b949e"> = </tspan><tspan fill="#a5d6ff">["Spring", "Django"]</tspan><tspan fill="#8b949e">;</tspan></text>
      <text x="43" y="140"><tspan fill="#79c0ff">frontend</tspan><tspan fill="#8b949e"> = </tspan><tspan fill="#a5d6ff">["Angular", "React"]</tspan><tspan fill="#8b949e">;</tspan></text>
      <text x="43" y="172"><tspan fill="#79c0ff">focus</tspan><tspan fill="#8b949e"> = </tspan><tspan fill="#a5d6ff">"scalable products"</tspan><tspan fill="#8b949e">;</tspan></text>
      <text x="43" y="204"><tspan fill="#79c0ff">ship</tspan><tspan fill="#8b949e">(</tspan><tspan fill="#ffa657">quality</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#ffa657">impact</tspan><tspan fill="#8b949e">);</tspan></text>
      <text x="24" y="232" fill="#f0f6fc">}</text>
    </g>
  </g>

  <g transform="translate(66 350)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">
    <rect width="153" height="35" rx="17.5" fill="#1f6feb" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".55"/>
    <text x="76.5" y="22" text-anchor="middle" fill="#79c0ff">SECURE APIs</text>
    <rect x="166" width="187" height="35" rx="17.5" fill="#238636" fill-opacity=".16" stroke="#3fb950" stroke-opacity=".55"/>
    <text x="259.5" y="22" text-anchor="middle" fill="#56d364">MULTI-TENANT SaaS</text>
    <rect x="366" width="170" height="35" rx="17.5" fill="#8957e5" fill-opacity=".16" stroke="#bc8cff" stroke-opacity=".55"/>
    <text x="451" y="22" text-anchor="middle" fill="#d2a8ff">AI WORKFLOWS</text>
    <rect x="549" width="132" height="35" rx="17.5" fill="#d29922" fill-opacity=".15" stroke="#e3b341" stroke-opacity=".55"/>
    <text x="615" y="22" text-anchor="middle" fill="#e3b341">DEVOPS</text>
  </g>

  <g fill="#58a6ff">
    <circle cx="1128" cy="369" r="4"/>
    <circle cx="1150" cy="369" r="4" opacity=".6"/>
    <circle cx="1172" cy="369" r="4" opacity=".3"/>
  </g>
</svg>
