<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-labelledby="title desc">
  <title id="title">GitHub statistics placeholder</title>
  <desc id="desc">Run the included GitHub Actions workflow once to replace this card with live statistics.</desc>
  <rect x="1" y="1" width="493" height="193" rx="16" fill="#0d1117" stroke="#30363d"/>
  <circle cx="46" cy="48" r="19" fill="#1f6feb" fill-opacity=".22" stroke="#58a6ff"/>
  <path d="M38 49 l6 6 11 -14" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="79" y="43" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">GitHub metrics</text>
  <text x="79" y="64" fill="#8b949e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Repository-owned and generated automatically</text>
  <rect x="31" y="91" width="433" height="64" rx="12" fill="#161b22" stroke="#21262d"/>
