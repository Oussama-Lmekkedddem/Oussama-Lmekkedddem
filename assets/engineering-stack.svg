<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Full-stack engineering system</title>
  <desc id="desc">A connected engineering flow from product needs to production delivery.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111c2c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset=".55" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="1200" height="330" rx="24" fill="url(#panel)" stroke="#30363d"/>
  <text x="52" y="50" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">ENGINEERING SYSTEM</text>
  <text x="1148" y="50" text-anchor="end" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">need → architecture → product → production</text>

  <path d="M128 170 H1071" stroke="url(#line)" stroke-width="4" stroke-linecap="round" opacity=".7"/>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(42 91)">
      <rect width="192" height="158" rx="18" fill="#111827" stroke="#58a6ff" stroke-opacity=".55"/>
      <circle cx="96" cy="79" r="32" fill="#1f6feb"/>
      <text x="96" y="86" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">01</text>
      <text x="96" y="128" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="700">PRODUCT NEED</text>
      <text x="96" y="149" text-anchor="middle" fill="#8b949e" font-size="12">Workflows · Users · Value</text>
    </g>

    <g transform="translate(273 91)">
      <rect width="192" height="158" rx="18" fill="#111827" stroke="#bc8cff" stroke-opacity=".55"/>
      <circle cx="96" cy="79" r="32" fill="#8957e5"/>
      <text x="96" y="86" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">02</text>
      <text x="96" y="128" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="700">ARCHITECTURE</text>
      <text x="96" y="149" text-anchor="middle" fill="#8b949e" font-size="12">Security · Tenancy · APIs</text>
    </g>

    <g transform="translate(504 91)">
      <rect width="192" height="158" rx="18" fill="#111827" stroke="#f778ba" stroke-opacity=".55"/>
      <circle cx="96" cy="79" r="32" fill="#bf4b8a"/>
      <text x="96" y="86" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">03</text>
      <text x="96" y="128" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="700">FULL-STACK</text>
      <text x="96" y="149" text-anchor="middle" fill="#8b949e" font-size="12">Spring · Django · Web UI</text>
    </g>

    <g transform="translate(735 91)">
      <rect width="192" height="158" rx="18" fill="#111827" stroke="#e3b341" stroke-opacity=".55"/>
      <circle cx="96" cy="79" r="32" fill="#9e6a03"/>
      <text x="96" y="86" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">04</text>
      <text x="96" y="128" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="700">DATA &amp; ASYNC</text>
      <text x="96" y="149" text-anchor="middle" fill="#8b949e" font-size="12">Postgres · Redis · Kafka</text>
    </g>

    <g transform="translate(966 91)">
      <rect width="192" height="158" rx="18" fill="#111827" stroke="#3fb950" stroke-opacity=".55"/>
      <circle cx="96" cy="79" r="32" fill="#238636"/>
      <text x="96" y="86" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">05</text>
      <text x="96" y="128" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="700">DELIVERY</text>
      <text x="96" y="149" text-anchor="middle" fill="#8b949e" font-size="12">Docker · CI/CD · Cloud</text>
    </g>
  </g>

  <g fill="#f0f6fc">
    <path d="M246 170 l12 -8 v16z"/>
    <path d="M477 170 l12 -8 v16z"/>
    <path d="M708 170 l12 -8 v16z"/>
    <path d="M939 170 l12 -8 v16z"/>
  </g>

  <text x="600" y="292" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">BUILD FOR TODAY  ·  DESIGN FOR CHANGE  ·  OPERATE WITH CONFIDENCE</text>
</svg>
